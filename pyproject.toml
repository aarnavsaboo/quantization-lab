[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantization-lab"
version = "0.1.0"
description = "Local model quantization experiment tooling"
requires-python = ">=3.10"

[project.scripts]
quantization-lab = "quantization_lab.__main__:main"

[tool.setuptools.packages.find]
include = ["quantization_lab*"]
